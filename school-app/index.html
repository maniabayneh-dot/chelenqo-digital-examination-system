<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e"><title>CHELENQO School App</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#17322a}.container{max-width:560px;margin:auto;padding:22px 16px 40px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 5px 20px #0001}h1{font-size:25px;margin:0 0 8px}h2{font-size:20px}.muted{color:#65756f;line-height:1.5}button{width:100%;border:0;border-radius:12px;padding:14px;margin:6px 0;font-size:16px;font-weight:700;background:#0b3d2e;color:#fff}button.secondary{background:#e8efec;color:#0b3d2e}input{width:100%;padding:14px;border:1px solid #ccd8d3;border-radius:10px;margin:5px 0 10px;font-size:16px}label{font-weight:700;font-size:14px;display:block;margin-top:10px}.hidden{display:none}.error{background:#fff0f0;color:#9b1c1c;padding:12px;border-radius:10px;margin:10px 0}.badge{display:inline-block;background:#e8efec;color:#0b3d2e;border-radius:99px;padding:7px 10px;font-size:13px;font-weight:700}
</style></head>
<body><div class="container">
<div class="card"><h1>CHELENQO SECONDARY SCHOOL</h1><div class="muted">Digital Examination System · Grades 9–12</div></div>
<div id="home" class="card"><h2>Welcome</h2><p class="muted">Choose your account type to continue.</p>
<button onclick="showLogin('student')">Student Login</button><button onclick="showLogin('teacher')" class="secondary">Teacher Login</button><button onclick="showLogin('admin')" class="secondary">Administrator Login</button></div>
<div id="login" class="card hidden"><span id="roleBadge" class="badge"></span><h2 id="loginTitle"></h2><div id="error" class="error hidden"></div>
<label id="identityLabel">Student ID</label><input id="identity" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password">
<div id="turnstile-widget" style="margin:10px 0"></div><div id="captchaStatus" class="muted" style="font-size:13px;margin:6px 0">Security check loading…</div><button id="loginBtn" onclick="login()" disabled>Sign in</button><button class="secondary" onclick="backHome()">Back</button></div>
<div id="dashboard" class="card hidden"><span class="badge">Verified CHELENQO account</span><h2 id="welcome"></h2><p id="details" class="muted"></p><button id="examBtn" onclick="alert('Examination module will be added next.')">Open Examinations</button><button class="secondary" onclick="logout()">Sign out</button></div>
<div class="card"><div class="muted" style="font-size:13px">© 2026 Chelenqo Secondary School</div></div></div>
<script>
const SUPABASE_URL="https://yqwbdpsbtugunmtbvito.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_fV-728OBBlzFUn3QVu3oDA_K7rQBzCw";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const homeEl=document.getElementById('home');
const loginEl=document.getElementById('login');
const dashboardEl=document.getElementById('dashboard');
const errorEl=document.getElementById('error');
const loginTitleEl=document.getElementById('loginTitle');
const roleBadgeEl=document.getElementById('roleBadge');
const identityLabelEl=document.getElementById('identityLabel');
const identityEl=document.getElementById('identity');
const passwordEl=document.getElementById('password');
const loginBtnEl=document.getElementById('loginBtn');
const welcomeEl=document.getElementById('welcome');
const detailsEl=document.getElementById('details');
const examBtnEl=document.getElementById('examBtn');
const turnstileWidgetEl=document.getElementById('turnstile-widget');
const captchaStatusEl=document.getElementById('captchaStatus');
const TURNSTILE_SITE_KEY='0x4AAAAAAGCCoGUVEAouz5uS';
let turnstileWidgetId=null;
let captchaToken=null;
let currentRole=null;
function renderTurnstile(){
  captchaToken=null; loginBtnEl.disabled=true; captchaStatusEl.textContent='Security check loading…';
  if(!window.turnstile){setTimeout(renderTurnstile,300);return;}
  if(turnstileWidgetId!==null){try{window.turnstile.reset(turnstileWidgetId)}catch(e){} return;}
  turnstileWidgetId=window.turnstile.render('#turnstile-widget',{sitekey:TURNSTILE_SITE_KEY,theme:'light',callback:function(token){captchaToken=token;captchaStatusEl.textContent='Security check complete ✓';loginBtnEl.disabled=false;},'expired-callback':function(){captchaToken=null;loginBtnEl.disabled=true;captchaStatusEl.textContent='Security check expired. Please complete it again.';},'error-callback':function(){captchaToken=null;loginBtnEl.disabled=true;captchaStatusEl.textContent='Security check could not load. Please refresh and try again.';}});
}
function showLogin(role){currentRole=role;homeEl.classList.add('hidden');dashboardEl.classList.add('hidden');loginEl.classList.remove('hidden');errorEl.classList.add('hidden');loginTitleEl.textContent={student:'CHELENQO Student Login',teacher:'CHELENQO Teacher Login',admin:'CHELENQO Administrator Login'}[role];roleBadgeEl.textContent=role.toUpperCase();identityLabelEl.textContent=role==='student'?'Student ID':'Email';identityEl.placeholder=role==='student'?'CHS-09-0001':'name@example.com';identityEl.value='';passwordEl.value='';setTimeout(renderTurnstile,0)}
function backHome(){loginEl.classList.add('hidden');homeEl.classList.remove('hidden')}
function studentEmail(id){return id.trim().toUpperCase().replaceAll('-','')+'@students.chelenqo.invalid'}
function showError(msg){errorEl.textContent=msg;errorEl.classList.remove('hidden')}
async function login(){const id=identityEl.value.trim(),pw=passwordEl.value;if(!captchaToken){showError('Complete the Cloudflare security check before signing in.');return}if(!id||!pw){showError('Enter your ID/email and password.');return}const email=currentRole==='student'?studentEmail(id):id;loginBtnEl.disabled=true;loginBtnEl.textContent='Signing in…';errorEl.classList.add('hidden');
try{const {data,error:e}=await supabaseClient.auth.signInWithPassword({email,password:pw,options:{captchaToken}});if(e)throw e;const {data:p,error:pe}=await supabaseClient.from('profiles').select('full_name,role,grade_level,section,stream,student_code,school_id').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(!p){await supabaseClient.auth.signOut();throw new Error('No CHELENQO profile was found for this account.')}if(p.school_id!=='CHELENQO'){await supabaseClient.auth.signOut();throw new Error('This account is not registered for CHELENQO.')}if(p.role!==currentRole){await supabaseClient.auth.signOut();throw new Error('This account does not have the selected role.')}loginEl.classList.add('hidden');dashboardEl.classList.remove('hidden');welcomeEl.textContent='Welcome, '+(p.full_name||'User');detailsEl.textContent=currentRole==='student'?'Student · Grade '+(p.grade_level||'')+' · '+(p.stream||'')+' · Section '+(p.section||''):currentRole==='teacher'?'Verified CHELENQO teacher. Your assigned subjects and results will appear here.':'Verified CHELENQO administrator. Administration tools will appear here.';examBtnEl.classList.toggle('hidden',currentRole!=='student')}catch(e){showError(e.message||'Sign-in failed.')}finally{captchaToken=null;loginBtnEl.disabled=true;loginBtnEl.textContent='Sign in';if(turnstileWidgetId!==null){try{window.turnstile.reset(turnstileWidgetId)}catch(e){}}}}
async function logout(){await supabaseClient.auth.signOut();dashboardEl.classList.add('hidden');homeEl.classList.remove('hidden')}
</script></body></html>
